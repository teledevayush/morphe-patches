name: Release

on:
  workflow_dispatch:
    inputs:
      send_fcm:
        description: 'Send FCM push notification'
        type: boolean
        default: true
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # =========================================================================
      # CUSTOM PROFILE TWEAKS: LANGUAGES, MANIFESTS, & GMS SELECTION RULES
      # =========================================================================
      - name: Apply Custom Light Profile Tweaks
        run: |
          echo "==== Step 1: Shredding non-English language localization strings ===="
          find . -name "build.gradle.kts" -exec sed -i '/defaultConfig {/a \        resConfigs("en")' {} +
          find . -name "build.gradle" -exec sed -i '/defaultConfig {/a \        resConfigs "en"' {} +

          echo "==== Step 2: Injecting battery optimization wake-lock hooks ===="
          find . -name "AndroidManifest.xml" -exec sed -i 's|</manifest>|<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/></manifest>|g' {} +

          echo "==== Step 3: Modifying Gradle parameters to suppress warnings ===="
          if [ -f "gradle.properties" ]; then
            echo "options.suppressWarnings=true" >> gradle.properties
            echo "options.allowExperimental=true" >> gradle.properties
          fi

          echo "==== Step 4: Rewriting target package name to com.rvx.android.youtube ===="
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.json" \) -exec sed -i 's/app.morphe.youtube/com.rvx.android.youtube/g' {} +
          find . -type f \( -name "*.kt" -o -name "*.java" -o -name "*.json" \) -exec sed -i 's/com.google.android.youtube.patched/com.rvx.android.youtube/g' {} +

          echo "==== Step 5: Injecting Multi-GMS Package Compatibility Selection ===="
          find . -type f -name "*GmsCore*.kt" -exec sed -i 's/"com.mgoogle.android.gms"/"app.revanced.android.gms", "com.mgoogle.android.gms"/g' {} +
          find . -type f -name "*GmsCore*.kt" -exec sed -i 's/"app.morphe.gms"/"app.revanced.android.gms", "com.mgoogle.android.gms"/g' {} +
          find . -type f -name "*.kt" -exec sed -i 's/listOf("com.mgoogle.android.gms")/listOf("app.revanced.android.gms", "com.mgoogle.android.gms")/g' {} +

      - name: Release
        uses: cycjimmy/semantic-release-action@v5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Generate website deploy token
        if: steps.release.outputs.new_release_published == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MORPHE_AAMATT_APP_ID }}
          private-key: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          owner: MorpheApp

      - name: Trigger website deploy
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'MorpheApp',
              repo: 'morphe-website',
              event_type: 'trigger-deploy'
            })

      - name: Wait before sending FCM
        if: steps.release.outputs.new_release_published == 'true' && (github.event_name == 'push' || inputs.send_fcm == true)
        run: sleep 300

      - name: Setup Python for FCM
        if: steps.release.outputs.new_release_published == 'true' && (github.event_name == 'push' || inputs.send_fcm == true)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Send FCM push notification
        if: steps.release.outputs.new_release_published == 'true' && (github.event_name == 'push' || inputs.send_fcm == true)
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_TYPE: bundle_update
          FCM_VERSION: ${{ steps.release.outputs.new_release_version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip install cryptography
          python3 .github/scripts/send_fcm.py
